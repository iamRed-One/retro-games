<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel arcade cabinet: Retro Arcade Revival's icon -->
  <rect width="32" height="32" rx="6" fill="#140c2e"/>
  <!-- Marquee -->
  <rect x="7" y="3" width="18" height="5" fill="#ff4dc8"/>
  <rect x="7" y="3" width="18" height="1" fill="#ff9ae3"/>
  <rect x="10" y="5" width="2" height="1" fill="#fbd536"/>
  <rect x="13" y="5" width="2" height="1" fill="#fbd536"/>
  <rect x="17" y="5" width="2" height="1" fill="#fbd536"/>
  <rect x="20" y="5" width="2" height="1" fill="#fbd536"/>
  <!-- Cabinet body -->
  <rect x="6" y="8" width="20" height="21" fill="#5b2a9a"/>
  <rect x="6" y="8" width="1" height="21" fill="#7c4ac8"/>
  <rect x="25" y="8" width="1" height="21" fill="#3a1866"/>
  <!-- Screen with a bouncing ball and a star -->
  <rect x="9" y="10" width="14" height="10" fill="#07051a"/>
  <rect x="9" y="10" width="14" height="1" fill="#2a1c45"/>
  <rect x="12" y="15" width="3" height="3" fill="#ff8a3d"/>
  <rect x="13" y="16" width="1" height="1" fill="#fff"/>
  <rect x="19" y="12" width="1" height="3" fill="#7be3ff"/>
  <rect x="18" y="13" width="3" height="1" fill="#7be3ff"/>
  <rect x="9" y="19" width="14" height="1" fill="#37c3a1"/>
  <!-- Control deck: joystick and buttons -->
  <rect x="7" y="21" width="18" height="4" fill="#3a1866"/>
  <rect x="11" y="20" width="1" height="3" fill="#cbdbfc"/>
  <rect x="10" y="19" width="3" height="2" fill="#e8486a"/>
  <rect x="17" y="22" width="2" height="2" fill="#fbd536"/>
  <rect x="20" y="22" width="2" height="2" fill="#37c3a1"/>
  <!-- Base -->
  <rect x="8" y="25" width="16" height="4" fill="#4a2380"/>
  <rect x="14" y="26" width="4" height="2" fill="#07051a"/>
</svg>
